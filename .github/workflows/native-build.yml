name: Build OneWifi Component in Native Environment

on:
  push:
    branches: [ main, 'release/**', develop ]
  pull_request:
    branches: [ main, 'release/**', topic/RDK*, develop ]
  workflow_dispatch:

concurrency:
  group: coverity-${{ github.ref }}
  cancel-in-progress: false   # don't kill an in-flight submission

permissions:
  contents: read

jobs:
  build-onewifi:
    name: Build OneWifi component in github rdkcentral for Coverity analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Reuse the patched hostap tree that the Build Check workflow
      # (makefile.yml) already produces and caches.
      - name: Restore patched hostap
        uses: actions/cache/restore@v5
        with:
          path: easymesh_project/rdk-wifi-libhostap
          key: hostap-bpi-
          restore-keys: hostap-bpi-
          fail-on-cache-miss: true

      - name: Native-ish build for Coverity based on XB
        run: |
          # prefill hostap tree restored from the Build Check cache.
          # setup_dependencies.sh skips the clone when the directory
          # already exists, so no upstream fetch happens for this dep.
          mkdir -p "$HOME/build"
          mv easymesh_project/rdk-wifi-libhostap "$HOME/build/"

          # Trust the workspace
          git config --global --add safe.directory '*'
          # Pull the latest changes for the native build system
          git submodule update --init --recursive

          chmod +x build_tools_workflows/cov_docker_script/setup_dependencies.sh
          ./build_tools_workflows/cov_docker_script/setup_dependencies.sh ./cov_docker_script/component_config.json
          # Build component
          chmod +x build_tools_workflows/cov_docker_script/build_native.sh
          ./build_tools_workflows/cov_docker_script/build_native.sh ./cov_docker_script/component_config.json

        env:
          GITHUB_TOKEN: ${{ secrets.RDKCM_RDKE }}
